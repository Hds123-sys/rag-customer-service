version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: rag_system
      MYSQL_USER: rag_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rag_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - rag-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    environment:
      - DEBUG=False
      - API_BASE_URL=${API_BASE_URL:-https://apihub.agnes-ai.com}
      - API_KEY=${API_KEY:-}
      - API_MODEL=${API_MODEL:-agnes-2.5-flash}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - VECTOR_STORE_MODE=qdrant
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATABASE_URL=mysql+pymysql://rag_user:${MYSQL_PASSWORD:-rag_password}@mysql:3306/rag_system
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY 必须设置}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - rag-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - rag-network

volumes:
  mysql_data:
  qdrant_data:

networks:
  rag-network:
    driver: bridge